<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>KTCSxAI • YouTube 4D Cinema Bridge (Slow-Mo & Fullscreen)</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; font-family: system-ui, sans-serif; }
    #player-host, #player-host iframe { width: 100%; height: 100%; border: none; display: block; }
    #rate-badge {
      position: fixed;
      top: 12px;
      left: 12px;
      background: rgba(15, 23, 42, 0.88);
      color: #fde047;
      border: 1px solid rgba(245, 158, 11, 0.5);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 800;
      z-index: 99;
      opacity: 0;
      transition: opacity 0.25s ease;
      pointer-events: none;
    }
    #rate-badge.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="rate-badge">🐢 Tốc độ: 1.0x</div>
  <div id="player-host"></div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v') || '_jGU_GvHsMM';
    const autoplay = params.get('autoplay') === '0' ? 0 : 1;
    let targetRate = parseFloat(params.get('rate') || '1') || 1;
    let ytPlayer = null;
    let badgeTimer = null;

    function showRateBadge(rate) {
      const b = document.getElementById('rate-badge');
      if (!b) return;
      b.textContent = rate < 1 ? `🐢 Tua chậm: ${rate}x` : (rate > 1 ? `⚡ Tua nhanh: ${rate}x` : `▶ Tốc độ chuẩn: 1x`);
      b.classList.add('show');
      clearTimeout(badgeTimer);
      badgeTimer = setTimeout(() => b.classList.remove('show'), 2200);
    }

    function applyRate(rate) {
      targetRate = parseFloat(rate) || 1;
      if (ytPlayer && typeof ytPlayer.setPlaybackRate === 'function') {
        try {
          ytPlayer.setPlaybackRate(targetRate);
          showRateBadge(targetRate);
        } catch (e) {}
      }
    }

    window.addEventListener('message', (event) => {
      const d = event.data;
      if (!d || typeof d !== 'object') return;
      if (d.type === 'KTCS_YT_SET_RATE') applyRate(d.rate);
      if (d.type === 'KTCS_YT_PLAY' && ytPlayer?.playVideo) ytPlayer.playVideo();
      if (d.type === 'KTCS_YT_PAUSE' && ytPlayer?.pauseVideo) ytPlayer.pauseVideo();
      if (d.type === 'KTCS_YT_MUTE' && ytPlayer?.mute) ytPlayer.mute();
      if (d.type === 'KTCS_YT_UNMUTE' && ytPlayer?.unMute) ytPlayer.unMute();
    });

    window.onYouTubeIframeAPIReady = function() {
      const origin = window.location.protocol.startsWith('http') ? window.location.origin : 'https://tuantute.life';
      ytPlayer = new YT.Player('player-host', {
        videoId: videoId,
        width: '100%',
        height: '100%',
        playerVars: {
          autoplay: autoplay,
          rel: 0,
          modestbranding: 1,
          enablejsapi: 1,
          hl: 'vi',
          cc_lang_pref: 'vi',
          cc_load_policy: 1,
          origin: origin
        },
        events: {
          onReady: (e) => {
            if (targetRate !== 1) applyRate(targetRate);
            window.parent.postMessage({ type: 'KTCS_YT_READY', videoId }, '*');
          },
          onError: (e) => {
            window.parent.postMessage({ type: 'KTCS_YT_ERROR', code: e.data, videoId }, '*');
          }
        }
      });
    };

    // Load YouTube IFrame API
    const tag = document.createElement('script');
    tag.src = 'https://www.youtube.com/iframe_api';
    tag.onerror = () => {
      const origin = window.location.protocol.startsWith('http') ? window.location.origin : 'https://tuantute.life';
      document.getElementById('player-host').innerHTML = `
        <iframe src="https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=${autoplay}&rel=0&hl=vi&cc_lang_pref=vi&cc_load_policy=1&enablejsapi=1&origin=${encodeURIComponent(origin)}"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          allowfullscreen style="width:100%;height:100%;border:none;"></iframe>`;
    };
    document.head.appendChild(tag);
  </script>
</body>
</html>
