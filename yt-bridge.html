<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>KTCSxAI - YouTube 4D Cinema Bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    #player-frame { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>
  <iframe id="player-frame" 
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
    allowfullscreen>
  </iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v') || 'UF8uR6Z6KLc';
    const autoplay = params.get('autoplay') === '0' ? 0 : 1;
    const frame = document.getElementById('player-frame');
    
    // Explicit origin to prevent Error 153
    const origin = window.location.protocol.startsWith('http') ? window.location.origin : 'https://tuantute.life';
    frame.src = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=${autoplay}&rel=0&enablejsapi=1&origin=${encodeURIComponent(origin)}`;
  </script>
</body>
</html>
