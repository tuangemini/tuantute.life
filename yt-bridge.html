<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>KTCSxAI - YouTube 4D Cinema Bridge</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #0b0f19; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; }
    #player-frame { width: 100%; height: 100%; border: none; display: block; }
    .loading {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: #94a3b8; font-size: 13px; gap: 8px;
      background: radial-gradient(circle at center, #1e1b4b 0%, #030712 100%);
    }
    .spinner {
      width: 32px; height: 32px; border: 3px solid rgba(239, 68, 68, 0.2);
      border-top-color: #ef4444; border-radius: 50%; animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="loading" class="loading">
    <div class="spinner"></div>
    <span>Đang kết nối luồng YouTube 4D Cinema...</span>
  </div>
  <iframe id="player-frame" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>

  <script>
    const params = new URLSearchParams(window.location.search);
    const videoId = params.get('v') || 'UF8uR6Z6KLc';
    const autoplay = params.get('autoplay') === '0' ? 0 : 1;
    const frame = document.getElementById('player-frame');
    const loading = document.getElementById('loading');

    frame.src = `https://www.youtube.com/embed/${encodeURIComponent(videoId)}?autoplay=${autoplay}&rel=0&enablejsapi=1&origin=${encodeURIComponent(window.location.origin)}`;
    frame.onload = () => {
      setTimeout(() => { if (loading) loading.style.display = 'none'; }, 600);
    };
  </script>
</body>
</html>
